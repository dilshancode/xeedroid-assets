<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="rgba(0, 240, 255, 0.06)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Ambient Glow Blobs -->
  <circle cx="260" cy="220" r="140" fill="#00f0ff" opacity="0.08" filter="url(#glow)"/>
  <circle cx="580" cy="200" r="120" fill="#10b981" opacity="0.08" filter="url(#glow)"/>

  <!-- RAM Stick Illustration (Center Left) -->
  <g transform="translate(140, 160)">
    <!-- Circuit board background -->
    <rect x="0" y="0" width="220" height="90" rx="8" fill="#111c33" stroke="#00f0ff" stroke-width="2" filter="url(#glow)"/>
    <!-- Gold connector pins -->
    <g fill="#f59e0b">
      <rect x="15" y="86" width="10" height="12" rx="1"/>
      <rect x="35" y="86" width="10" height="12" rx="1"/>
      <rect x="55" y="86" width="10" height="12" rx="1"/>
      <rect x="75" y="86" width="10" height="12" rx="1"/>
      <rect x="105" y="86" width="10" height="12" rx="1"/>
      <rect x="125" y="86" width="10" height="12" rx="1"/>
      <rect x="145" y="86" width="10" height="12" rx="1"/>
      <rect x="165" y="86" width="10" height="12" rx="1"/>
      <rect x="185" y="86" width="10" height="12" rx="1"/>
    </g>
    <!-- RAM memory chip modules -->
    <rect x="20" y="16" width="38" height="52" rx="4" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
    <rect x="68" y="16" width="38" height="52" rx="4" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
    <rect x="116" y="16" width="38" height="52" rx="4" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
    <rect x="164" y="16" width="38" height="52" rx="4" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
    <!-- Chip details -->
    <text x="39" y="46" fill="#00f0ff" font-family="monospace" font-size="9" text-anchor="middle" font-weight="bold">DDR5</text>
    <text x="87" y="46" fill="#00f0ff" font-family="monospace" font-size="9" text-anchor="middle" font-weight="bold">6400</text>
    <text x="135" y="46" fill="#00f0ff" font-family="monospace" font-size="9" text-anchor="middle" font-weight="bold">LOW</text>
    <text x="183" y="46" fill="#00f0ff" font-family="monospace" font-size="9" text-anchor="middle" font-weight="bold">LAT</text>
  </g>

  <!-- Performance Meter / Speed Dial (Right) -->
  <g transform="translate(480, 110)">
    <!-- Outer Arc Track -->
    <circle cx="110" cy="110" r="85" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="14"/>
    <!-- Filled Arc (Cyan to Emerald) -->
    <circle cx="110" cy="110" r="85" fill="none" stroke="url(#cyanGrad)" stroke-width="14" stroke-dasharray="380" stroke-dashoffset="110" stroke-linecap="round"/>
    
    <!-- Central Metric Display -->
    <text x="110" y="98" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="800" text-anchor="middle">-1.8 GB</text>
    <text x="110" y="126" fill="#10b981" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">IDLE RAM SAVED</text>
    <text x="110" y="146" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">ZERO BACKGROUND LAG</text>
  </g>

  <!-- Header Banner Overlays -->
  <rect x="40" y="36" width="160" height="28" rx="6" fill="rgba(0, 240, 255, 0.12)" stroke="rgba(0, 240, 255, 0.4)"/>
  <text x="120" y="55" fill="#00f0ff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1">WINDOWS 11 TWEAKS</text>

  <!-- Bottom Brand Title -->
  <text x="40" y="380" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800">Windows 11 RAM Optimization Guide</text>
  <text x="40" y="410" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16">Trim Bloated Background Services • Speed Up Gaming & Workflows</text>
</svg>
