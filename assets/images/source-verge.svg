<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="vgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12061e"/>
      <stop offset="60%" stop-color="#1e0b33"/>
      <stop offset="100%" stop-color="#0a0312"/>
    </linearGradient>
    <linearGradient id="vgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="vgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#vgBg)"/>

  <!-- Matrix Grid -->
  <g stroke="rgba(225, 29, 72, 0.08)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="400" cy="210" r="160" fill="#9333ea" opacity="0.1" filter="url(#vgGlow)"/>

  <!-- Iconic The Verge Monogram/Triangle Accent -->
  <g transform="translate(350, 90)">
    <polygon points="50,10 90,90 10,90" fill="none" stroke="url(#vgGrad)" stroke-width="6" filter="url(#vgGlow)"/>
    <polygon points="50,28 78,82 22,82" fill="url(#vgGrad)" opacity="0.3"/>
  </g>

  <!-- Top Badge -->
  <rect x="40" y="36" width="160" height="28" rx="6" fill="rgba(225, 29, 72, 0.12)" stroke="rgba(225, 29, 72, 0.4)"/>
  <text x="120" y="55" fill="#f43f5e" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1">GADGETS &amp; CULTURE</text>

  <!-- Title & Publication Details -->
  <text x="400" y="240" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" text-anchor="middle" letter-spacing="-0.02em">THE VERGE</text>
  <text x="400" y="280" fill="#c084fc" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="2">CONSUMER TECH • REVIEWS • CULTURE</text>
  <text x="400" y="315" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">Technology, Science, Art &amp; Design Coverage</text>
</svg>
