<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="piBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051226"/>
      <stop offset="60%" stop-color="#092042"/>
      <stop offset="100%" stop-color="#030b17"/>
    </linearGradient>
    <linearGradient id="winBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0078d4"/>
    </linearGradient>
    <filter id="piGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#piBg)"/>

  <!-- Matrix Grid -->
  <g stroke="rgba(0, 120, 212, 0.08)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="400" cy="210" r="160" fill="#0078d4" opacity="0.1" filter="url(#piGlow)"/>

  <!-- Windows 4-Square Flag Logo -->
  <g transform="translate(355, 95)">
    <rect x="0" y="0" width="40" height="40" rx="4" fill="url(#winBlue)" filter="url(#piGlow)"/>
    <rect x="50" y="0" width="40" height="40" rx="4" fill="url(#winBlue)" filter="url(#piGlow)"/>
    <rect x="0" y="50" width="40" height="40" rx="4" fill="url(#winBlue)" filter="url(#piGlow)"/>
    <rect x="50" y="50" width="40" height="40" rx="4" fill="url(#winBlue)" filter="url(#piGlow)"/>
  </g>

  <!-- Top Badge -->
  <rect x="40" y="36" width="160" height="28" rx="6" fill="rgba(0, 120, 212, 0.15)" stroke="rgba(0, 240, 255, 0.4)"/>
  <text x="120" y="55" fill="#00f0ff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1">WINDOWS &amp; PC</text>

  <!-- Title & Publication Details -->
  <text x="400" y="245" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" text-anchor="middle" letter-spacing="-0.02em">PUREINFOTECH</text>
  <text x="400" y="280" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="2">WINDOWS 11 • UPDATES • TUTORIALS</text>
  <text x="400" y="315" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">Microsoft Windows OS News &amp; Technical Step-by-Step Guides</text>
</svg>
