<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="acBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041712"/>
      <stop offset="60%" stop-color="#082b21"/>
      <stop offset="100%" stop-color="#020d0a"/>
    </linearGradient>
    <linearGradient id="acGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ddc84"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="acGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#acBg)"/>

  <!-- Matrix Grid -->
  <g stroke="rgba(61, 220, 132, 0.08)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="400" cy="210" r="160" fill="#3ddc84" opacity="0.08" filter="url(#acGlow)"/>

  <!-- Android Robot Head Icon -->
  <g transform="translate(355, 95)">
    <!-- Head Dome -->
    <path d="M 0 50 A 45 45 0 0 1 90 50 Z" fill="url(#acGreen)" filter="url(#acGlow)"/>
    <!-- Left Antenna -->
    <line x1="20" y1="18" x2="10" y2="2" stroke="url(#acGreen)" stroke-width="5" stroke-linecap="round"/>
    <!-- Right Antenna -->
    <line x1="70" y1="18" x2="80" y2="2" stroke="url(#acGreen)" stroke-width="5" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="28" cy="36" r="4.5" fill="#041712"/>
    <circle cx="62" cy="36" r="4.5" fill="#041712"/>
  </g>

  <!-- Top Badge -->
  <rect x="40" y="36" width="160" height="28" rx="6" fill="rgba(61, 220, 132, 0.12)" stroke="rgba(61, 220, 132, 0.4)"/>
  <text x="120" y="55" fill="#3ddc84" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1">MOBILE &amp; ANDROID</text>

  <!-- Title & Publication Details -->
  <text x="400" y="245" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" text-anchor="middle" letter-spacing="-0.02em">ANDROID CENTRAL</text>
  <text x="400" y="280" fill="#3ddc84" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="2">PHONES • WEARABLES • APPS • OS</text>
  <text x="400" y="315" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">Android Ecosystem News, Reviews, Tips &amp; Tutorials</text>
</svg>
