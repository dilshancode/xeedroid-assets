<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="vhdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1f"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#060814"/>
    </linearGradient>
    <linearGradient id="diskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="vhdGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#vhdBg)"/>

  <!-- Matrix grid lines -->
  <g stroke="rgba(129, 140, 248, 0.08)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="280" cy="200" r="130" fill="#818cf8" opacity="0.1" filter="url(#vhdGlow)"/>
  <circle cx="560" cy="210" r="120" fill="#00f0ff" opacity="0.1" filter="url(#vhdGlow)"/>

  <!-- Left: Disk Drive Stack Graphic -->
  <g transform="translate(100, 100)">
    <!-- Drive 1 (Bottom) -->
    <rect x="0" y="110" width="280" height="42" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
    <circle cx="25" cy="131" r="5" fill="#10b981"/>
    <text x="50" y="136" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Local Physical Disk (C:)</text>

    <!-- Drive 2 (Middle) -->
    <rect x="0" y="55" width="280" height="42" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
    <circle cx="25" cy="76" r="5" fill="#3b82f6"/>
    <text x="50" y="81" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Storage Partition (D:)</text>

    <!-- Drive 3 (Top Virtual Disk - Highlighted) -->
    <rect x="0" y="0" width="280" height="44" rx="8" fill="#111c33" stroke="#00f0ff" stroke-width="2" filter="url(#vhdGlow)"/>
    <circle cx="25" cy="22" r="5" fill="#00f0ff"/>
    <text x="50" y="27" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Virtual Hard Drive (V:)</text>
    <rect x="200" y="10" width="65" height="24" rx="4" fill="rgba(0,240,255,0.15)"/>
    <text x="232" y="26" fill="#00f0ff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">VHDX</text>
  </g>

  <!-- Right: Storage Diagram & Metric -->
  <g transform="translate(460, 100)">
    <!-- Container Box -->
    <rect x="0" y="0" width="260" height="160" rx="10" fill="#0f172a" stroke="rgba(129, 140, 248, 0.4)" stroke-width="2" filter="url(#vhdGlow)"/>
    <text x="24" y="36" fill="#c084fc" font-family="monospace" font-size="12" font-weight="bold">> New-VHD -Path Data.vhdx</text>
    <text x="24" y="62" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Dynamic Capacity: Up to 64 TB</text>
    
    <rect x="24" y="80" width="212" height="12" rx="6" fill="#1e293b"/>
    <rect x="24" y="80" width="130" height="12" rx="6" fill="url(#diskGrad)"/>
    
    <text x="24" y="116" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="600">✓ Isolated Safe Storage File</text>
    <text x="24" y="136" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Zero partition reformatting</text>
  </g>

  <!-- Top Badge -->
  <rect x="40" y="36" width="170" height="28" rx="6" fill="rgba(192, 132, 252, 0.12)" stroke="rgba(192, 132, 252, 0.4)"/>
  <text x="125" y="55" fill="#c084fc" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1">STORAGE &amp; PARTITIONS</text>

  <!-- Bottom Title -->
  <text x="40" y="380" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800">Windows 11 Virtual Hard Drive (VHD) Setup</text>
  <text x="40" y="410" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16">Initialize, Partition, and Mount Virtual Disks Without Buying Hardware</text>
</svg>
